# The primary arm builds the index with NO options and queries with
# only mkt.nprobe: meerkat's defaults resolve to its benchmarked
# configuration at any scale (auto nlist = rows/256, fastscan posting
# and centroid layouts, SOAR + boundary replication), and nprobe = 0
# keeps the automatic derivation (~0.95 recall@10 out of the box).
# Query args are [nprobe, topk] pairs; the nprobe grid spans roughly
# recall 0.7 to 0.99+ at 10M-100M scale.
float:
  angular:
  - base_args: ['@metric']
    constructor: Meerkat
    disabled: false
    docker_tag: ann-benchmarks-meerkat
    module: ann_benchmarks.algorithms.meerkat
    name: meerkat
    run_groups:
      default:
        arg_groups: [{}]
        query_args:
          [[[0, 10], [10, 10], [20, 10], [40, 10], [80, 10],
            [120, 10], [160, 10], [240, 10], [320, 10], [480, 10],
            [640, 10], [960, 10], [1440, 10]]]
  euclidean:
  - base_args: ['@metric']
    constructor: Meerkat
    disabled: false
    docker_tag: ann-benchmarks-meerkat
    module: ann_benchmarks.algorithms.meerkat
    name: meerkat
    run_groups:
      default:
        arg_groups: [{}]
        query_args:
          [[[0, 10], [10, 10], [20, 10], [40, 10], [80, 10],
            [120, 10], [160, 10], [240, 10], [320, 10], [480, 10],
            [640, 10], [960, 10], [1440, 10]]]
