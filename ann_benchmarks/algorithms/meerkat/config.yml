      nlist-3000-soar:
        arg_groups: [{nlist: 3000, soar_lambda: 1.5}]
        query_args: [[[5, 10], [10, 10], [20, 10],
              [40, 10], [60, 10], [80, 10],
              [120, 10], [200, 10]]]
