float:
  angular:
  - base_args: ['@metric']
    constructor: Meerkat
    disabled: false
    docker_tag: ann-benchmarks-meerkat
    module: ann_benchmarks.algorithms.meerkat
    name: meerkat
    run_groups:
      nlist-1000:
        arg_groups: [{nlist: 1000}]
        query_args: [[[5, 10], [10, 10], [20, 10],
              [40, 10], [60, 10], [80, 10],
              [120, 10], [200, 10]]]
  - base_args: ['@metric']
